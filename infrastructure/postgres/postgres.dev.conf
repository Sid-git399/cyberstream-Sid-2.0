# CyberStream - PostgreSQL dev-mode configuration.
# Tuned for a normal development laptop (cahier des charges §6/§68), not a
# production server. Load-test mode should use a separate, larger config -
# not written yet; add infrastructure/postgres/postgres.loadtest.conf
# alongside this one when Phase 15 (Load Lab) needs it, rather than
# editing this file in place.

listen_addresses = '*'
max_connections = 50

shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

wal_level = replica
max_wal_size = 512MB
min_wal_size = 80MB

log_min_duration_statement = 200
log_line_prefix = '%m [%p] %q%u@%d '
