name: cyberstream

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-cyberstream-net}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: cyberstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: "cyberstream-dev-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: cyberstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS_INTERNAL: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:29092}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS_DEV:-3}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: cyberstream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberstream}
      POSTGRES_USER: ${POSTGRES_USER:-cyberstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgres.dev.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberstream} -d ${POSTGRES_DB:-cyberstream}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # One-shot: applies Alembic migrations, then exits. `backend` and any
  # future consumer of the schema depend on this completing successfully.
  # Schema is defined once, in backend/alembic/versions/ - never duplicated
  # as raw SQL, so there is exactly one source of truth.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberstream-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST_INTERNAL:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cyberstream}
      POSTGRES_USER: ${POSTGRES_USER:-cyberstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberstream-backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST_INTERNAL:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cyberstream}
      POSTGRES_USER: ${POSTGRES_USER:-cyberstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:29092}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # Idle by default; run explicitly: `docker compose run --rm generator generate --events 1000`
  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: cyberstream-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:29092}
      GENERATOR_DEFAULT_RATE: ${GENERATOR_DEFAULT_RATE:-100}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
    entrypoint: ["tail", "-f", "/dev/null"]
    logging: *default-logging

  # --- Not yet wired in: frontend (Phase 13) ---

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: cyberstream-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      CYBERSTREAM_MODE: ${CYBERSTREAM_MODE:-dev}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:29092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-cyberstream-processing}
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS:-latest}
      POSTGRES_HOST: ${POSTGRES_HOST_INTERNAL:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cyberstream}
      POSTGRES_USER: ${POSTGRES_USER:-cyberstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      SPARK_MASTER: local[*]
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR:-/data/checkpoints}
      SPARK_SHUFFLE_PARTITIONS_DEV: ${SPARK_SHUFFLE_PARTITIONS_DEV:-4}
      SPARK_SHUFFLE_PARTITIONS_LOADTEST: ${SPARK_SHUFFLE_PARTITIONS_LOADTEST:-16}
      SPARK_WATERMARK_DELAY_MINUTES: ${SPARK_WATERMARK_DELAY_MINUTES:-5}
      SPARK_TRIGGER_INTERVAL_SECONDS: ${SPARK_TRIGGER_INTERVAL_SECONDS:-10}
      PARQUET_DATA_DIR: ${PARQUET_DATA_DIR:-/data/parquet}
      PRIVILEGED_USERS: ${PRIVILEGED_USERS:-admin,root,backup,administrator}
      DETECTION_ENGINE_ENABLED: ${DETECTION_ENGINE_ENABLED:-true}
      DETECTION_RULES_CONFIG_PATH: ${DETECTION_RULES_CONFIG_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging

  # frontend: added in Phase 13, alongside the real React app

volumes:
  kafka_data:
  postgres_data:
